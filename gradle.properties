#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
# (Linux/CI) usa JAVA_HOME do ambiente / local.properties. NAO commitar path absoluto de SO.
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
# ⚠️ `ignoreDisabledTargets` é o que faz um alvo indisponível virar `SKIPPED` em vez de erro — e é
# ele que deixa o Gradle imprimir `BUILD SUCCESSFUL` sem ter compilado nada. Sempre confira o
# `SKIPPED` no log antes de acreditar no verde.
kotlin.native.ignoreDisabledTargets=true

# =============================================================================
# O alvo iOS COMPILA fora do Mac — e estava DESLIGADO aqui (10/set/2026)
# =============================================================================
#
# Esta linha estava em `false`, e é a razão de a casa ter passado meses acreditando que "alvo Apple
# só compila no Mac". Não é verdade: o que exige Xcode é o **link** do framework; a COMPILAÇÃO do
# Kotlin — onde mora todo `unresolved reference`, todo enum Objective-C escrito errado e todo cast
# impossível — roda em qualquer host com a cross-compilation de klib (Kotlin 2.0.20+).
#
# Com ela ligada, basta declarar os alvos:
#
#   ./gradlew compileKotlinIosArm64 -Pkmplib.forceAppleTargets=true
#
# No Mac não muda nada (lá todo alvo Apple já é nativo). No servidor, é o que impede uma versão
# inteira de sair sem compilar para iOS — foi o que aconteceu com a 2.192.0.
kotlin.native.enableKlibsCrossCompilation=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Publishing
# Desabilitar assinatura para testes locais (habilitar apenas para Maven Central)
signing.required=false
# org.gradle.java.home deve ser configurado em local.properties ou via variável de ambiente
# Versão ÚNICA de todos os módulos da lib — lida pelo convention plugin `kmplib.module`.
# Uma versão só para o conjunto (como Ktor e SQLDelight fazem): o app que combina kmplib-core com
# kmplib-ui nunca precisa conferir se as duas versões conversam.
kmplib.version=2.213.0
