#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
# (Linux/CI) usa JAVA_HOME do ambiente / local.properties. NAO commitar path absoluto de SO.
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Publishing
# Desabilitar assinatura para testes locais (habilitar apenas para Maven Central)
signing.required=false
# org.gradle.java.home deve ser configurado em local.properties ou via variável de ambiente
# Versão ÚNICA de todos os módulos da lib — lida pelo convention plugin `kmplib.module`.
# Uma versão só para o conjunto (como Ktor e SQLDelight fazem): o app que combina kmplib-core com
# kmplib-ui nunca precisa conferir se as duas versões conversam.
kmplib.version=2.173.0
