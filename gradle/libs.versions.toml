[versions]
agp = "8.11.2"
kotlin = "2.3.0"
android-minSdk = "24"
android-compileSdk = "36"
vanniktechMavenPublish = "0.34.0"
kover = "0.9.1"

# KMP dependencies
coroutines = "1.10.2"
doistNormalize = "1.2.0"
kotlinxSerialization = "1.9.0"
kotlinxDatetime = "0.7.1"
ktor = "3.1.1"
kmpnotifier = "1.6.0"

# Firebase (GitLive) - mantido em 2.1.0 pois 2.3.0 não suporta iosX64
firebaseGitlive = "2.1.0"

# RevenueCat
revenuecatKmp = "2.2.13+17.23.0"

# Compose
composeMultiplatform = "1.10.0"
material3 = "1.10.0-alpha05"

# AndroidX
androidxCore = "1.13.1"
activityCompose = "1.10.1"
biometric = "1.1.0"
exifinterface = "1.4.1"
lifecycle = "2.9.6"
credentials = "1.5.0"

# Google Identity
googleid = "1.1.1"

# Coil (Image loading for Custom Ads)
coil = "3.0.4"

# Google Maps (GAP-02) e Location (GAP-04)
mapsCompose = "6.7.2"
playServicesMaps = "19.2.0"
playServicesLocation = "21.3.0"

# Camera + OCR de placa (GAP-ME-01)
cameraX = "1.4.2"
mlkitTextRecognition = "16.0.1"

# SQLDelight (sync offline-first — T1a). 2.0.x suporta Kotlin 2.x / KMP Android+iOS.
sqldelight = "2.0.2"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# DateTime
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Push Notifications
kmpnotifier = { module = "io.github.mirzemehdi:kmpnotifier", version.ref = "kmpnotifier" }

# Unicode Normalization
doist-normalize = { module = "com.doist.x:normalize", version.ref = "doistNormalize" }

# Firebase GitLive
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebaseGitlive" }
firebase-storage = { module = "dev.gitlive:firebase-storage", version.ref = "firebaseGitlive" }
firebase-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "firebaseGitlive" }

# Firebase Android (explicit versions for GitLive 2.1.0 compatibility)
firebase-auth-android = { module = "com.google.firebase:firebase-auth-ktx", version = "23.1.0" }
firebase-storage-android = { module = "com.google.firebase:firebase-storage", version = "21.0.1" }
firebase-common-android = { module = "com.google.firebase:firebase-common-ktx", version = "21.0.0" }
firebase-config = { module = "dev.gitlive:firebase-config", version.ref = "firebaseGitlive" }
firebase-config-android = { module = "com.google.firebase:firebase-config", version = "22.0.1" }
firebase-crashlytics-android = { module = "com.google.firebase:firebase-crashlytics-ktx", version = "19.3.0" }
firebase-analytics-android = { module = "com.google.firebase:firebase-analytics-ktx", version = "22.1.2" }

# RevenueCat
purchases-kmp-core = { module = "com.revenuecat.purchases:purchases-kmp-core", version.ref = "revenuecatKmp" }
purchases-kmp-result = { module = "com.revenuecat.purchases:purchases-kmp-result", version.ref = "revenuecatKmp" }
# purchases-kmp-datetime removido: referencia o kotlinx.datetime.Instant antigo (removido no 0.7.x)
# e quebra o R8 no release; não é usado pela lib. Ver library/build.gradle.kts.

# Compose Runtime (for VisualTransformation and UI Components)
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatform" }

# AndroidX
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Coil (Image loading for Custom Ads)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Google Maps (GAP-02 — Android) e Location (GAP-04 — Android)
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# Camera + OCR de placa (GAP-ME-01 — Android)
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }

# SQLDelight (sync offline-first — T1a)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-dialect-sqlite = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
