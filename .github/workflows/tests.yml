name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests + Kover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # A cobertura soma todos os módulos (`kover.merge` no build.gradle.kts da raiz). O
      # koverVerifyUnit depende dos testes de unidade de cada um, então é ele que os roda.
      - name: Run Android unit tests + verify Kover threshold
        run: ./gradlew koverVerifyUnit --continue

      - name: Generate Kover reports
        if: always()
        run: ./gradlew koverHtmlReportUnit koverXmlReportUnit

      - name: Upload Kover HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-html-report
          path: build/reports/kover/htmlUnit/
          retention-days: 30

      - name: Upload Kover XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-xml-report
          path: build/reports/kover/reportUnit.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: '**/build/test-results/testDebugUnitTest/'
          retention-days: 14

  ios-tests:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # Todos os módulos que linkam no simulador. Ficam de fora os que importam framework que só o
      # app traz (Sentry, FirebaseMessaging): `ld: framework not found`. Os testes deles seguem no
      # job do Android. Heap maior: com o padrão de 2 GB o compilador estoura em kmplib-inspection.
      - name: Run iOS Simulator tests
        run: >-
          ./gradlew iosSimulatorArm64Test --continue --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx3g
          -x :kmplib-ads:iosSimulatorArm64Test
          -x :kmplib-firebase:iosSimulatorArm64Test
          -x :kmplib-monetization:iosSimulatorArm64Test
          -x :kmplib-observability:iosSimulatorArm64Test
          -x :kmplib-push:iosSimulatorArm64Test
          -x :kmplib-testing:iosSimulatorArm64Test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: '**/build/test-results/iosSimulatorArm64Test/'
          retention-days: 14
