name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests + Kover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run Android unit tests
        run: ./gradlew :kmplib:testDebugUnitTest

      - name: Generate Kover HTML report
        if: always()
        run: ./gradlew :kmplib:koverHtmlReport

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :kmplib:koverXmlReport

      - name: Verify Kover coverage threshold
        if: always()
        run: ./gradlew :kmplib:koverVerify

      - name: Upload Kover HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: library/build/reports/kover/html/
          retention-days: 30

      - name: Upload Kover XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: library/build/reports/kover/report.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: library/build/test-results/
          retention-days: 14

  ios-tests:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run iOS Simulator tests
        run: ./gradlew :kmplib:iosSimulatorArm64Test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: library/build/test-results/
          retention-days: 14
