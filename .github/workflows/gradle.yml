# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Só o alvo jvm (hoje, `kmplib-workout`, que tem teste exclusivo em jvmTest). Android e iOS rodam
    # em todos os módulos no tests.yml; a matriz antiga chamava `testAndroidHostTest` e `linuxX64Test`,
    # que não existem nesta lib, e a primeira que caía cancelava as outras.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6
    - uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: jvmTest
