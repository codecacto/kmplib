name: 'Compute Version'
description: 'Calcula versão (SemVer) e build number a partir de tags git'

inputs:
  version-override:
    description: 'Sobrescreve a marketing version (ignora tag git)'
    required: false
    default: ''

outputs:
  marketing_version:
    description: 'Marketing version (X.Y.Z)'
    value: ${{ steps.compute.outputs.marketing_version }}
  build_number:
    description: 'Build number (incremental)'
    value: ${{ steps.compute.outputs.build_number }}
  version_code:
    description: 'Android versionCode (inteiro crescente)'
    value: ${{ steps.compute.outputs.version_code }}
  git_sha:
    description: 'Short git SHA'
    value: ${{ steps.compute.outputs.git_sha }}

runs:
  using: 'composite'
  steps:
    - name: Compute versions
      id: compute
      shell: bash
      run: |
        set -euo pipefail

        GIT_SHA="$(git rev-parse --short=8 HEAD)"

        if [ -n "${{ inputs.version-override }}" ]; then
          MARKETING_VERSION="${{ inputs.version-override }}"
        else
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.1.0")"
          MARKETING_VERSION="${LAST_TAG#v}"
        fi

        # Build number: usa GITHUB_RUN_NUMBER (auto-incremental por workflow)
        BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "${MARKETING_VERSION}"
        MAJOR="${MAJOR:-0}"
        MINOR="${MINOR:-1}"
        PATCH="${PATCH:-0}"

        # versionCode: usa GITHUB_RUN_NUMBER diretamente (sempre crescente, sem colisão)
        # Alternativa com versão embutida: MAJOR*10000000 + MINOR*100000 + PATCH*1000 + BUILD
        VERSION_CODE="${BUILD_NUMBER}"

        echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
        echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
        echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"

        echo "--- Version Info ---"
        echo "Marketing: ${MARKETING_VERSION}"
        echo "Build:     ${BUILD_NUMBER}"
        echo "Code:      ${VERSION_CODE}"
        echo "SHA:       ${GIT_SHA}"
